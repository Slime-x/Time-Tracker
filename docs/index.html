<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="logo"><img src="logo.png"></div>

        <ul class="top-bar">
            <li>
                <a href="#" onclick="openWindow('stopwatch-window'); return false;"> Timer </a>
            </li>
            <li>
                <a href="#" onclick="openWindow('stopwatch-window'); return false;"> Timer </a>
            </li>
            <li>
                <a href="#" onclick="openWindow('stopwatch-window'); return false;"> Timer </a>
            </li>
            <li>
                <a href="#" onclick="openWindow('stopwatch-window'); return false;"> Timer </a>
            </li>



        </ul>
    </header>



    <div id="stopwatch-window" class="window">
        <div id="window-titlebar">
            <span class="window-title">Stop Watch</span>
            <div id="window-buttons">
                <button class="window-btn" onclick="closeWindow('stopwatch-window')" aria-label="Close">&times;</button>
            </div>
        </div>
        <div class="Window-body">
            <div id="stopwatch">
                <h1 id="SW">Stop Watch</h1>

                <div id="container">
                    <div id="display">
                        00:00:00
                    </div>
                    <div id="controls">
                        <button id="startBtn" onclick="start()">Start</button>
                        <button id="stopBtn" onclick="stop()">Stop</button>
                        <button id="resetBtn" onclick="reset()">Reset</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="clock-container">
        <div class="clock-background">
            <div id="clock"></div>
            <div id="date"></div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
