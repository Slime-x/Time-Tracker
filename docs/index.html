<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="logo"><img src="logo.png"></div>

        <ul class="top-bar">
            <li>
                <a href="#" onclick="openWindow('stopwatch-window'); return false;">Timer </a>
            </li>

            <li>

                <a href="#" onclick="openWindow('music-window'); return false;">Music</a>
            </li>

            <li>
                <a href="#" onclick="openWindow('stopwatch-window'); return false;"> Timer </a>
            </li>

            <li>
                <a href="#" onclick="openWindow('stopwatch-window'); return false;"> Timer </a>
            </li>



        </ul>
    </header>

    /* ========= Clock ========= */

    <div id="clock-container">
        <div class="clock-background">
            <div id="clock"></div>
            <div id="date"></div>
        </div>
    </div>

    /* ========= Stop Watch ========== */

    <div id="stopwatch-window" class="os-window">
        <div class="window-titlebar">
            <span class="window-title">Stop Watch</span>
            <div class="window-buttons">
                <button class="window-btn" onclick="closeWindow('stopwatch-window')" aria-label="Close">&times;</button>
            </div>
        </div>
        <div class="window-body">
            <div id="stopwatch">
                <div id="container">
                    <div id="display">
                        00:00:00
                    </div>
                    <div id="controls">
                        <button id="startBtn" onclick="start()">Start</button>
                        <button id="stopBtn" onclick="stop()">Stop</button>
                        <button id="resetBtn" onclick="reset()">Reset</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="window-resize-handle"></div>
    </div>


    /* =========== Music =========== */
    <div id="music-window" class="os-window">
        <div id="window-titlebar">
            <span class="window-title">Music</span>
            <div class="window-buttons">
                <button class="window-btn" onclick="closeWindow('music-window')" aria-label="Close">&times;</button>
            </div>
        </div>
        <div class="window-body">
            <div id="music-player">
                <div class="music-categories">
                    <button class="cat-btn active" onclick="switchCategory('lofi', this)">Lo-Fi</button>
                    <button class="cat-btn active" onclick="switchCategory('nature', this)">Ambient</button>
                    <button class="cat-btn active" onclick="switchCategory('piano', this)">Rap</button>
                    <button class="cat-btn active" onclick="switchCategory('synth', this)">IDFK</button>
                </div>

                <div class="tracck-row" id="track-row"></div>

                <div class="now-playing-bar">
                    <span id="now-playing-label">No music Playing</span>
                    <div id="now-playing-controls">
                        <button id="lockBtn" onclick="toggleLock()">🔓 Repeat Off</button>
                        <button onclick="stopMusic()">⏹ No Music</button>
                    </div>
                </div>
            </div>
        </div>

    </div>


    <script src="index.js"></script>
</body>

</html>
