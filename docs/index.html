<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<!---Teset-->

<body>
    <header>
        <div class="logo"><a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ&start_radio=1"
                target="_blank"><img src="logo.png"></a></div>

        <ul class="top-bar">
            <li>
                <a class="header-btn" href="#" onclick="openWindow('stopwatch-window'); return false;">StopWatch</a>
            </li>

            <li>

                <a class="header-btn" href="#" onclick="openWindow('music-window'); return false;">Music</a>
            </li>

            <li>
                <a class="header-btn" href="#" onclick="openWindow('alarm-window'); return false;"> Alarm+</a>
            </li>

            <li>
                <a class="header-btn" href="#" onclick="openWindow('stopwatch-window'); return false;"> Timer</a>
            </li>



        </ul>
    </header>

    <!-- ========= Clock ========= -->

    <div id="clock-container">
        <div class="clock-background">
            <div id="clock"></div>
            <div id="date"></div>
        </div>
    </div>

    <!-- ========= Stop Watch ========== -->

    <div id="stopwatch-window" class="os-window">
        <div class="window-titlebar">
            <span class="window-title">Stop Watch</span>
            <div class="window-buttons">
                <button class="window-btn" onclick="closeWindow('stopwatch-window')" aria-label="Close">&times;</button>
            </div>
        </div>
        <div class="window-body">
            <div id="stopwatch">
                <div id="container">
                    <div id="display">
                        00:00:00
                    </div>
                    <div id="controls">
                        <button class="SWbtn" id="startBtn" onclick="start()">Start</button>
                        <button class="SWbtn" id="stopBtn" onclick="stop()">Stop</button>
                        <button class="SWbtn" id="resetBtn" onclick="reset()">Reset</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="window-resize-handle"></div>
    </div>


    <!-- =========== Music =========== -->
    <div id="music-window" class="os-window">
        <div class="window-titlebar">
            <span class="window-title">Music</span>
            <div class="window-buttons">
                <button class="window-btn" onclick="closeWindow('music-window')" aria-label="Close">&times;</button>
            </div>
        </div>
        <div class="window-body">
            <div id="music-player">
                <div class="music-categories">
                    <button class="cat-btn active" onclick="switchCategory('lofi', this)">Lo-Fi</button>
                    <button class="cat-btn active" onclick="switchCategory('ambient', this)">Ambient</button>
                    <button class="cat-btn active" onclick="switchCategory('smth1', this)">Rap</button>
                    <button class="cat-btn active" onclick="switchCategory('smth2', this)">IDFK</button>
                </div>

                <div class="track-row" id="track-row"></div>

                <div class="now-playing-bar">
                    <span id="now-playing-label">No music Playing</span>
                    <div class="now-playing-controls">
                        <button id="lockBtn" onclick="toggleLock()">🔓 Repeat Off</button>
                        <button onclick="stopMusic()">⏹ No Music</button>
                    </div>
                </div>

                <audio id="musicAudio"></audio>
            </div>
        </div>
        <div class="window-resize-handle"></div>
    </div>


    <!-- =========== Alarm =========== -->
    <div id="alarm-window" class="os-window">
        <div class="window-titlebar">
            <span class="window-title">Alarm</span>
            <div class="window-buttons">
                <button class="window-btn" onclick="closeWindow('alarm-window')" aria-label="Close">&times;</button>
            </div>
        </div>
        <div class="window-body">
            <div id="alarm-player">
                <div class="alarm-modes">
                    <button class="cat-btn active" id="alarmModeBtn"
                        onclick="switchAlarmMode('clock', this)">Alarm</button>
                    <button class="cat-btn" id="timerModeBtn" onclick="switchAlarmMode('timer', this)">Timer</button>
                </div>

                <!-- Clock-time alarm -->
                <div id="alarm-clock-view" class="alarm-view">
                    <input type="time" id="alarmTimeInput">
                    <div class="alarm-actions">
                        <button class="SWbtn" id="startBtn" onclick="setClockAlarm()">Set Alarm</button>
                        <button class="SWbtn" id="stopBtn" onclick="cancelAlarm()">Cancel</button>
                    </div>
                    <div id="alarmStatus" class="alarm-status">No alarm set</div>
                </div>

                <!-- Countdown timer -->
                <div id="alarm-timer-view" class="alarm-view" style="display:none;">
                    <div class="timer-inputs">
                        <input type="number" id="timerHours" min="0" placeholder="HH">
                        <input type="number" id="timerMinutes" min="0" placeholder="MM">
                        <input type="number" id="timerSeconds" min="0" placeholder="SS">
                    </div>
                    <div id="timerDisplay">00:00:00</div>
                    <div class="alarm-actions">
                        <button id="startBtn" class="SWbtn" onclick="startTimer()">Start</button>
                        <button id="pauseBtn" class="SWbtn" onclick="pauseTimer()">Pause</button>
                        <button id="resetBtn" class="SWbtn" onclick="resetTimer()">Reset</button>
                    </div>
                </div>

                <button id="dismissAlarmBtn" onclick="dismissAlarm()" style="display:none;">Dismiss Alarm</button>
            </div>
        </div>
        <div class="window-resize-handle"></div>
    </div>

    <audio id="alarmAudio" src="music/prom_queen.mp3" loop></audio>



    <script src="index.js"></script>
</body>

</html>
